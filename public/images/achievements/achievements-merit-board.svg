<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1F36"/>
      <stop offset="100%" stop-color="#060F1D"/>
    </linearGradient>
    <linearGradient id="meritGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <rect width="900" height="550" rx="16" fill="url(#boardBg)"/>
  <rect x="16" y="16" width="868" height="518" rx="12" fill="none" stroke="#1E3A63" stroke-width="2"/>
  <rect x="24" y="24" width="852" height="502" rx="8" fill="#091629" stroke="url(#meritGold)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Plaque Header -->
  <g transform="translate(450, 90)">
    <!-- Laurel Garland -->
    <path d="M -180 10 C -220 -20, -180 -60, -90 -60" fill="none" stroke="url(#meritGold)" stroke-width="2"/>
    <path d="M 180 10 C 220 -20, 180 -60, 90 -60" fill="none" stroke="url(#meritGold)" stroke-width="2"/>
    
    <text y="-30" font-family="'Playfair Display', serif" font-size="28" font-weight="700" fill="url(#meritGold)" text-anchor="middle" letter-spacing="2">
      HONOR ROLL &amp; ACADEMIC MERIT BOARD
    </text>
    <text y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="3">
      JOIN ME COMMERCE CLASSES • JULE SOLAPUR
    </text>
  </g>

  <!-- 3 Editorial Showcase Frames awaiting verified client data -->
  <!-- Card 1 -->
  <g transform="translate(70, 150)">
    <rect width="230" height="260" rx="10" fill="#0C1D34" stroke="#1E3A63" stroke-width="1.5"/>
    <circle cx="115" cy="70" r="40" fill="#081424" stroke="url(#meritGold)" stroke-width="1.5"/>
    <text x="115" y="78" font-family="'Playfair Display', serif" font-size="26" font-weight="700" fill="#FCD34D" text-anchor="middle">HSC</text>
    
    <rect x="25" y="130" width="180" height="28" rx="4" fill="#060E18"/>
    <text x="115" y="149" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">
      12th COMMERCE BOARD
    </text>

    <text x="115" y="185" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">
      Maharashtra State Board
    </text>
    <text x="115" y="205" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">
      Solapur Division
    </text>
    
    <rect x="25" y="225" width="180" height="22" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <text x="115" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle">
      [Verified Topper Records]
    </text>
  </g>

  <!-- Card 2 (Center - CA Foundation) -->
  <g transform="translate(335, 140)">
    <rect width="230" height="280" rx="10" fill="#0F2440" stroke="url(#meritGold)" stroke-width="2"/>
    <circle cx="115" cy="75" r="44" fill="#0A182B" stroke="url(#meritGold)" stroke-width="2"/>
    <text x="115" y="83" font-family="'Playfair Display', serif" font-size="28" font-weight="700" fill="#FCD34D" text-anchor="middle">CA</text>
    
    <rect x="25" y="140" width="180" height="30" rx="4" fill="#081423"/>
    <text x="115" y="160" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FCD34D" text-anchor="middle">
      CA FOUNDATION (ICAI)
    </text>

    <text x="115" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">
      Professional Entry Distinction
    </text>
    <text x="115" y="215" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">
      National Level Accounting
    </text>
    
    <rect x="20" y="235" width="190" height="26" rx="4" fill="#78350F" stroke="#D97706" stroke-width="1"/>
    <text x="115" y="252" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#FEF3C7" text-anchor="middle">
      [Certified Rankers Archive]
    </text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(600, 150)">
    <rect width="230" height="260" rx="10" fill="#0C1D34" stroke="#1E3A63" stroke-width="1.5"/>
    <circle cx="115" cy="70" r="40" fill="#081424" stroke="url(#meritGold)" stroke-width="1.5"/>
    <text x="115" y="78" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#FCD34D" text-anchor="middle">100</text>
    
    <rect x="25" y="130" width="180" height="28" rx="4" fill="#060E18"/>
    <text x="115" y="149" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">
      SUBJECT CENTUMS
    </text>

    <text x="115" y="185" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">
      Bookkeeping &amp; Accountancy
    </text>
    <text x="115" y="205" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">
      Solapur Student Records
    </text>
    
    <rect x="25" y="225" width="180" height="22" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <text x="115" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle">
      [Verified Centum Marks]
    </text>
  </g>

  <!-- Bottom Verification Guarantee Plaque -->
  <g transform="translate(100, 445)">
    <rect width="700" height="52" rx="8" fill="#061220" stroke="#1E3A63" stroke-width="1"/>
    <circle cx="35" cy="26" r="10" fill="#059669"/>
    <path d="M 30 26 L 33 29 L 40 22" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="55" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">
      AUTHENTICITY STANDARD: NO FABRICATED STUDENT NAMES OR UNVERIFIED MARKS
    </text>
    <text x="55" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#94A3B8">
      Official merit roll, marksheet cards &amp; student testimonials will be published directly from Prof. Bhandare's institute register.
    </text>
  </g>
</svg>
