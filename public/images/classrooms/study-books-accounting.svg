<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1D33"/>
      <stop offset="100%" stop-color="#060F1C"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bookBg)"/>

  <!-- Open Ledger Book -->
  <g transform="translate(150, 100)">
    <!-- Book Shadow -->
    <ellipse cx="250" cy="300" rx="270" ry="25" fill="#030811" opacity="0.6"/>
    
    <!-- Left Page -->
    <path d="M 250 250 C 180 255, 60 240, 20 230 L 20 50 C 60 60, 180 75, 250 70 Z" fill="#F8F6F0" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Right Page -->
    <path d="M 250 250 C 320 255, 440 240, 480 230 L 480 50 C 440 60, 320 75, 250 70 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Spine -->
    <line x1="250" y1="70" x2="250" y2="250" stroke="#94A3B8" stroke-width="3"/>

    <!-- Left page ruled lines & ledger text -->
    <g stroke="#E2E8F0" stroke-width="1.5">
      <line x1="45" y1="95" x2="230" y2="100"/>
      <line x1="45" y1="120" x2="230" y2="125"/>
      <line x1="45" y1="145" x2="230" y2="150"/>
      <line x1="45" y1="170" x2="230" y2="175"/>
      <line x1="45" y1="195" x2="230" y2="200"/>
      <line x1="120" y1="75" x2="120" y2="225" stroke="#FCA5A5" stroke-width="1"/>
    </g>

    <text x="60" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0A1628">JOURNAL ENTRIES (HSC)</text>
    <text x="60" y="115" font-family="monospace" font-size="9" fill="#1E293B">Bank A/c ......... Dr.</text>
    <text x="80" y="138" font-family="monospace" font-size="9" fill="#1E293B">To Equity Share Cap.</text>
    <text x="60" y="165" font-family="monospace" font-size="9" fill="#1E293B">Machinery A/c ... Dr.</text>
    <text x="80" y="190" font-family="monospace" font-size="9" fill="#1E293B">To Vendor A/c</text>

    <!-- Right page: Balance Sheet -->
    <g stroke="#E2E8F0" stroke-width="1.5">
      <line x1="270" y1="100" x2="455" y2="95"/>
      <line x1="270" y1="125" x2="455" y2="120"/>
      <line x1="270" y1="150" x2="455" y2="145"/>
      <line x1="270" y1="175" x2="455" y2="170"/>
      <line x1="270" y1="200" x2="455" y2="195"/>
      <line x1="380" y1="75" x2="380" y2="225" stroke="#FCA5A5" stroke-width="1"/>
    </g>
    <text x="280" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">CA FOUNDATION PAPER 1</text>
    <text x="280" y="115" font-family="monospace" font-size="9" fill="#1E293B">Financial Statements</text>
    <text x="280" y="140" font-family="monospace" font-size="9" fill="#1E293B">Depreciation &amp; BRS</text>
    <text x="280" y="165" font-family="monospace" font-size="9" fill="#1E293B">Inventory Valuation</text>
    <text x="280" y="190" font-family="monospace" font-size="9" fill="#047857">Audited &amp; Reconciled</text>
  </g>

  <!-- Scientific / Financial Calculator -->
  <g transform="translate(560, 220)">
    <rect width="160" height="210" rx="14" fill="#0F1F36" stroke="#2B4365" stroke-width="2"/>
    <!-- Solar strip / display -->
    <rect x="15" y="18" width="130" height="42" rx="6" fill="#040912" stroke="#17263C" stroke-width="1.5"/>
    <text x="135" y="47" font-family="monospace" font-size="20" font-weight="bold" fill="#34D399" text-anchor="end">100.00%</text>
    
    <!-- Keys Grid -->
    <g fill="#1E3250" stroke="#2B4365" stroke-width="1">
      <rect x="15" y="72" width="26" height="22" rx="4"/>
      <rect x="49" y="72" width="26" height="22" rx="4"/>
      <rect x="83" y="72" width="26" height="22" rx="4"/>
      <rect x="117" y="72" width="26" height="22" rx="4" fill="#D97706"/>
      
      <rect x="15" y="102" width="26" height="22" rx="4"/>
      <rect x="49" y="102" width="26" height="22" rx="4"/>
      <rect x="83" y="102" width="26" height="22" rx="4"/>
      <rect x="117" y="102" width="26" height="22" rx="4"/>

      <rect x="15" y="132" width="26" height="22" rx="4"/>
      <rect x="49" y="132" width="26" height="22" rx="4"/>
      <rect x="83" y="132" width="26" height="22" rx="4"/>
      <rect x="117" y="132" width="26" height="22" rx="4"/>

      <rect x="15" y="162" width="60" height="24" rx="4"/>
      <rect x="83" y="162" width="60" height="24" rx="4" fill="#047857"/>
    </g>
    <text x="113" y="178" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">TOTAL</text>
  </g>

  <!-- Banner label -->
  <g transform="translate(60, 420)">
    <rect width="320" height="42" rx="8" fill="#091626" stroke="url(#goldAcc)" stroke-width="1.5"/>
    <text x="160" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FCD34D" text-anchor="middle">
      CURRICULUM &amp; PROBLEM-SOLVING MATERIAL
    </text>
  </g>
</svg>
