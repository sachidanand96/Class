<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="crGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38"/>
      <stop offset="60%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#060E1A"/>
    </linearGradient>
    <linearGradient id="wbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#crGrad)"/>
  
  <!-- Perspective Lines of Classroom -->
  <polygon points="0,0 200,80 600,80 800,0" fill="#0D1B30" opacity="0.6"/>
  <polygon points="0,500 150,380 650,380 800,500" fill="#070E1A" stroke="#1E3A63" stroke-width="1"/>
  
  <!-- Teaching Whiteboard -->
  <rect x="200" y="80" width="400" height="200" rx="8" fill="url(#wbGrad)" stroke="#64748B" stroke-width="4"/>
  
  <!-- Board details -->
  <rect x="220" y="95" width="360" height="24" rx="4" fill="#0A1628"/>
  <text x="400" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">
    PARTNERSHIP FINAL ACCOUNTS • ADJUSTMENTS
  </text>
  
  <!-- Ledger T-Chart on Whiteboard -->
  <line x1="380" y1="130" x2="380" y2="250" stroke="#0F172A" stroke-width="2"/>
  <line x1="230" y1="150" x2="550" y2="150" stroke="#0F172A" stroke-width="1.5"/>
  <text x="290" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Trading &amp; Profit &amp; Loss A/c</text>
  <text x="470" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Balance Sheet (₹)</text>
  <text x="240" y="170" font-family="monospace" font-size="10" fill="#334155">To Opening Stock: ₹45,000</text>
  <text x="240" y="190" font-family="monospace" font-size="10" fill="#334155">To Purchases:    ₹1,80,000</text>
  <text x="240" y="210" font-family="monospace" font-size="10" fill="#334155">To Gross Profit c/d: ₹92,000</text>
  <text x="400" y="170" font-family="monospace" font-size="10" fill="#334155">Capital A/c: ₹3,50,000</text>
  <text x="400" y="190" font-family="monospace" font-size="10" fill="#334155">Current Liabilities: ₹64,000</text>
  <text x="400" y="210" font-family="monospace" font-size="10" fill="#047857">Total Balanced: ₹4,14,000</text>

  <!-- Desks and seating rows -->
  <g stroke="#1E3A63" stroke-width="2" fill="#0B1A2D">
    <!-- Row 1 -->
    <rect x="180" y="320" width="440" height="40" rx="4"/>
    <rect x="220" y="300" width="70" height="20" rx="2" fill="#142640"/>
    <rect x="365" y="300" width="70" height="20" rx="2" fill="#142640"/>
    <rect x="510" y="300" width="70" height="20" rx="2" fill="#142640"/>
    
    <!-- Row 2 -->
    <rect x="120" y="390" width="560" height="50" rx="4"/>
    <rect x="170" y="365" width="85" height="25" rx="2" fill="#142640"/>
    <rect x="355" y="365" width="85" height="25" rx="2" fill="#142640"/>
    <rect x="545" y="365" width="85" height="25" rx="2" fill="#142640"/>
  </g>

  <!-- Watermark badge -->
  <g transform="translate(30, 430)">
    <rect width="250" height="40" rx="6" fill="#0A1628" stroke="#1E3A63" stroke-width="1"/>
    <text x="15" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
      Lecture Hall Setup • Kanishk Plaza
    </text>
  </g>
</svg>
