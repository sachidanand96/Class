<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18"/>
      <stop offset="50%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#142948"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E3A63" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="650" rx="16" fill="url(#heroBg)"/>
  <rect width="900" height="650" rx="16" fill="url(#centerGlow)"/>
  <rect x="16" y="16" width="868" height="618" rx="12" fill="none" stroke="#1E3A63" stroke-width="1.5"/>

  <!-- Academic Crest Seal -->
  <g transform="translate(450, 150)">
    <circle r="72" fill="#0A1E34" stroke="url(#goldSheen)" stroke-width="2.5"/>
    <circle r="62" fill="#061220" stroke="#2A4E82" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Monogram JM -->
    <text y="14" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="url(#goldSheen)" text-anchor="middle" letter-spacing="2">
      JM
    </text>

    <!-- Laurel Garland Wreath -->
    <path d="M -50 20 C -65 -15, -45 -50, -10 -60" fill="none" stroke="url(#goldSheen)" stroke-width="2" opacity="0.7"/>
    <path d="M 50 20 C 65 -15, 45 -50, 10 -60" fill="none" stroke="url(#goldSheen)" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Institute Title Banner -->
  <g transform="translate(450, 270)">
    <text y="0" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      JOIN ME COMMERCE CLASSES
    </text>
    <text y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FCD34D" text-anchor="middle" letter-spacing="3">
      JULE SOLAPUR BRANCH • MAHARASHTRA
    </text>
    <text y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">
      Academic Direction: Prof. Pradeep Bhandare Sir
    </text>
  </g>

  <!-- Three Prominent Curriculum Cards -->
  <g transform="translate(60, 360)">
    <!-- Card 1: HSC Board -->
    <g transform="translate(0, 0)">
      <rect width="240" height="210" rx="12" fill="#0C1D34" stroke="#1E3A63" stroke-width="1.5"/>
      <rect x="20" y="20" width="200" height="30" rx="6" fill="#061220"/>
      <text x="120" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">
        HSC COMMERCE
      </text>
      <text x="120" y="85" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        Class 11 &amp; 12
      </text>
      <line x1="40" y1="105" x2="200" y2="105" stroke="#1E3A63" stroke-width="1"/>
      <text x="120" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">
        Bookkeeping &amp; Accounts
      </text>
      <text x="120" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">
        Economics • OCM • SP
      </text>
      <text x="120" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">
        State Board Focus
      </text>
    </g>

    <!-- Card 2: CA Foundation -->
    <g transform="translate(270, 0)">
      <rect width="240" height="210" rx="12" fill="#0E2340" stroke="url(#goldSheen)" stroke-width="1.5"/>
      <rect x="20" y="20" width="200" height="30" rx="6" fill="#061220"/>
      <text x="120" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FCD34D" text-anchor="middle" letter-spacing="1">
        ICAI FOUNDATION
      </text>
      <text x="120" y="85" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        CA Foundation
      </text>
      <line x1="40" y1="105" x2="200" y2="105" stroke="#2B486F" stroke-width="1"/>
      <text x="120" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">
        Accounting &amp; Mercantile Law
      </text>
      <text x="120" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">
        Quantitative Aptitude &amp; Eco
      </text>
      <text x="120" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FCD34D" text-anchor="middle">
        Professional Entrance
      </text>
    </g>

    <!-- Card 3: Degree Commerce -->
    <g transform="translate(540, 0)">
      <rect width="240" height="210" rx="12" fill="#0C1D34" stroke="#1E3A63" stroke-width="1.5"/>
      <rect x="20" y="20" width="200" height="30" rx="6" fill="#061220"/>
      <text x="120" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">
        UNDERGRADUATE
      </text>
      <text x="120" y="85" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        B.Com &amp; BBA
      </text>
      <line x1="40" y1="105" x2="200" y2="105" stroke="#1E3A63" stroke-width="1"/>
      <text x="120" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">
        Financial &amp; Cost Accounts
      </text>
      <text x="120" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">
        Business Management
      </text>
      <text x="120" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">
        University Support
      </text>
    </g>
  </g>
</svg>
