<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#142948"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#studBg)"/>
  
  <!-- Collaborative Study Round Table -->
  <ellipse cx="400" cy="310" rx="300" ry="110" fill="#0C1F38" stroke="#1E3A63" stroke-width="2"/>
  <ellipse cx="400" cy="310" rx="270" ry="90" fill="#081525" stroke="#162A45" stroke-width="1.5"/>

  <!-- Student Icons Around Table -->
  <!-- Student 1 (Left) -->
  <g transform="translate(180, 210)">
    <circle cx="35" cy="25" r="24" fill="#1E3A63" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 0 85 C 0 55, 70 55, 70 85 Z" fill="#152A47" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Notebook -->
    <rect x="45" y="70" width="35" height="25" rx="3" fill="#F8FAFC" transform="rotate(15 45 70)"/>
  </g>

  <!-- Student 2 (Center-Left) -->
  <g transform="translate(310, 160)">
    <circle cx="35" cy="25" r="24" fill="#065F46" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 0 85 C 0 55, 70 55, 70 85 Z" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <!-- Laptop screen -->
    <polygon points="15,75 55,75 60,95 10,95" fill="#334155"/>
    <rect x="18" y="55" width="34" height="22" rx="2" fill="#38BDF8"/>
  </g>

  <!-- Student 3 (Center-Right) -->
  <g transform="translate(430, 160)">
    <circle cx="35" cy="25" r="24" fill="#92400E" stroke="#FCD34D" stroke-width="1.5"/>
    <path d="M 0 85 C 0 55, 70 55, 70 85 Z" fill="#78350F" stroke="#FCD34D" stroke-width="1.5"/>
    <!-- Accountancy workbook -->
    <rect x="-10" y="70" width="35" height="25" rx="3" fill="#F8FAFC" transform="rotate(-15 -10 70)"/>
  </g>

  <!-- Student 4 (Right) -->
  <g transform="translate(560, 210)">
    <circle cx="35" cy="25" r="24" fill="#1E3A63" stroke="#60A5FA" stroke-width="1.5"/>
    <path d="M 0 85 C 0 55, 70 55, 70 85 Z" fill="#152A47" stroke="#60A5FA" stroke-width="1.5"/>
  </g>

  <!-- Central Documents on Table -->
  <g transform="translate(350, 275)">
    <rect x="0" y="0" width="100" height="70" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" transform="rotate(-5)"/>
    <line x1="15" y1="18" x2="85" y2="18" stroke="#0284C7" stroke-width="2"/>
    <line x1="15" y1="32" x2="70" y2="32" stroke="#64748B" stroke-width="1.5"/>
    <line x1="15" y1="44" x2="80" y2="44" stroke="#64748B" stroke-width="1.5"/>
    <line x1="15" y1="56" x2="60" y2="56" stroke="#10B981" stroke-width="2"/>
  </g>

  <!-- Speech bubble: Interactive Doubt Resolution -->
  <g transform="translate(240, 70)">
    <rect width="320" height="50" rx="10" fill="#0E233E" stroke="#2563EB" stroke-width="1.5"/>
    <polygon points="400,120 410,135 420,120" fill="#0E233E"/>
    <text x="160" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      "Clarifying Partnership Goodwill &amp; Revaluation A/c"
    </text>
  </g>

  <!-- Watermark badge -->
  <g transform="translate(450, 425)">
    <rect width="300" height="42" rx="6" fill="#071322" stroke="#1E3A63" stroke-width="1"/>
    <text x="150" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">
      Peer Discussion &amp; Mentorship Environment
    </text>
  </g>
</svg>
